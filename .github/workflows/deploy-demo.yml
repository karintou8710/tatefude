# demo/ を GitHub Pages (https://karintou8710.github.io/tatefude/) に出す。
name: Deploy demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  # deploy-pages が OIDC で Pages に投げるのに要る
  id-token: write

# 走っている途中に push されたら新しいほうを採る
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # packageManager フィールドから pnpm の版を読む
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @tatefude/demo build
        env:
          BASE_PATH: /tatefude/
      # Pages は静的配信なので /tatefude/novel を直接開くと 404 になる。同じ index を
      # 404.html にも置くと、そこから BrowserRouter が URL を読み直して続けられる
      - run: cp demo/dist/index.html demo/dist/404.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: demo/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
